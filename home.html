<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Diaporama photos</title>
    <link rel="stylesheet" href="Src/site.css" />
  </head>
  <body>
    <main class="slideshow" aria-label="Diaporama photo">
      <img id="slideshowImage" class="slideshow__image" alt="Photo du diaporama" />
      <div class="slideshow__overlay">
        <button id="pauseButton" class="pause-button" type="button" aria-pressed="false">Pause</button>
        <button id="fullscreenButton" class="fullscreen-button" type="button">Plein écran</button>
        <div id="photoCounter" class="photo-counter" aria-live="polite"></div>
      </div>
    </main>
    <script src="Src/site.js"></script>
  </body>
</html>
